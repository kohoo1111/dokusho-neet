name: Discover and import books

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      max_imports:
        description: "1回の実行で新規に取り込む本の最大数"
        default: "200"
      max_minutes:
        description: "1回の実行の最大実行時間(分)"
        default: "45"

concurrency:
  group: discover-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm discover:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          MAX_IMPORTS_PER_RUN: ${{ inputs.max_imports || '200' }}
          MAX_MINUTES_PER_RUN: ${{ inputs.max_minutes || '45' }}
